name: CD - ISC
on:
  workflow_run:
    workflows: ["CI - ISC"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Create app directory on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            mkdir -p /home/ubuntu/app/Database/schema
          '
      - name: Copy docker-compose.yml to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem ./Workshop_3/docker-compose.yml ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/
      - name: Copy Database schema to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem -r ./Workshop_3/Database/schema/* ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/Database/schema/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            cd /home/ubuntu/app
            
            # Pull latest images with --no-cache equivalent
            docker compose pull --ignore-pull-failures || true
            docker compose down
            docker image prune -af  # Remove old images
            
            # Pull again to ensure fresh images
            docker compose pull
            
            # Start new containers
            docker compose up -d --force-recreate
            
            # Show running containers
            docker compose ps
          '
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            cd /home/ubuntu/app
            
            # Wait a bit for containers to start
            sleep 10
            
            # Check if all containers are running
            if [ $(docker compose ps -q | wc -l) -eq 4 ]; then
              echo "All 4 containers are running"
              docker compose ps
            else
              echo "Deployment verification failed"
              docker compose ps
              exit 1
            fi
          '
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
