name: CD - ISC
on:
  workflow_run:
    workflows: ["CI - ISC"]
    types:
      - completed
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Create app directory on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            mkdir -p /home/ubuntu/app/Database/schema
          '
      - name: Copy docker-compose.yml to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem ./isc-project/docker-compose.yml ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

      - name: Copy Database schema to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem -r ./isc-project/Database/schema/* ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/Database/schema/

      - name: Create environment files on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            mkdir -p /home/ubuntu/app/env
            
            # Create database.env
            cat > /home/ubuntu/app/env/database.env << "EOF"
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          EOF
            
            # Create java-backend.env
            cat > /home/ubuntu/app/env/java-backend.env << "EOF"
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
            
          # Create python-backend.env
          cat > /home/ubuntu/app/env/python-backend.env << "EOF"
          APP_ENV=prod

          DB_HOST=db
          DB_PORT=5432
          DB_NAME=${{ secrets.POSTGRES_DB }}
          DB_USER=${{ secrets.POSTGRES_USER }}
          DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          JAVA_BACKEND_URL=${{ secrets.JAVA_BACKEND_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
            
            echo "Environment files created"
            ls -la /home/ubuntu/app/env/
          '

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            cd /home/ubuntu/app
            
            # Pull latest images with --no-cache equivalent
            docker compose pull --ignore-pull-failures || true
            docker compose down
            docker image prune -af  # Remove old images
            
            # Pull again to ensure fresh images
            docker compose pull
            
            # Start new containers
            docker compose up -d --force-recreate
            
            # Show running containers
            docker compose ps
          '
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            cd /home/ubuntu/app
            
            # Wait a bit for containers to start
            sleep 10
            
            # Check if all containers are running
            if [ $(docker compose ps -q | wc -l) -eq 4 ]; then
              echo "All 4 containers are running"
              docker compose ps
            else
              echo "Deployment verification failed"
              docker compose ps
              exit 1
            fi
          '
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
