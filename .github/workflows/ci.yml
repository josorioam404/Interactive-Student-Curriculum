name: CI - ISC
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      #   Java Backend Tests (JUnit)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Java backend tests 
        working-directory: ./Workshop_3/Backend/java-backend/auth
        run: echo "Testing java backend" 
        # mvn -B test
      #   Python Backend Tests (pytest)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        working-directory: ./Workshop_3/Backend/python-backend
        run: pip install -r requirements.txt
      - name: Run Python tests 
        working-directory: ./Workshop_3/Backend/python-backend
        run: echo "Testing python backend" 
        # pytest -q
      #   Frontend Tests (Jest)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        working-directory: ./Workshop_3/Frontend
        run: npm ci
      - name: Run frontend tests 
        working-directory: ./Workshop_3/Frontend
        run: echo "Testing frontend" 
        #npm test -- --ci --watchAll=false
  #   Build & Push Images Only AFTER Tests Pass
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests  # wait for test job to succeed
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      # --- Login to Docker Hub ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # --- Login to GHCR ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --- Docker Buildx ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      #   Java Backend Image
      - name: Build & Push Java backend
        uses: docker/build-push-action@v5
        with:
          context: ./Workshop_3/Backend/java-backend/auth
          file: ./Workshop_3/Backend/java-backend/auth/Dockerfile
          push: true
          tags: |
            josorioam404/isc-java-backend:latest
            ghcr.io/josorioam404/isc-java-backend:latest
      #   Python Backend Image
      - name: Build & Push Python backend
        uses: docker/build-push-action@v5
        with:
          context: ./Workshop_3/Backend/python-backend
          file: ./Workshop_3/Backend/python-backend/Dockerfile
          push: true
          tags: |
            josorioam404/isc-python-backend:latest
            ghcr.io/josorioam404/isc-python-backend:latest
      #   Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          build-args: |
            VITE_PYTHON_API_URL: "http://54.89.37.108:8000"
            VITE_JAVA_API_URL: "http://54.89.37.108:8080"
          context: ./Workshop_3/Frontend
          file: ./Workshop_3/Frontend/Dockerfile
          push: true          
          no-cache: true                    
          provenance: false                
          sbom: false
          tags: |
            josorioam404/isc-frontend:latest
            ghcr.io/josorioam404/isc-frontend:latest

