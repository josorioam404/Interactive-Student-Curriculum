name: CI - ISC

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java backend tests
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Java backend tests
        working-directory: ./isc-project/Backend/java-backend/auth
        run: echo "Test java backend"
        # mvn -B test

      # Python backend tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        working-directory: ./isc-project/Backend/python-backend
        run: pip install -r requirements.txt

      - name: Run Python tests
        working-directory: ./isc-project/Backend/python-backend
        run: echo "Test python backend"
        # pytest -q

      # Frontend tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: ./isc-project/Frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./isc-project/Frontend
        run: echo "Test frontend"
        # npm test --if-present -- --ci --watchAll=false

  # Build and push images if tests succeeded
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Generate immutable image tag (first 7 chars of SHA)
      - name: Define image tag
        id: vars
        run: echo "TAG=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      # Login to Docker registries
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Java backend
      - name: Build & Push Java backend
        uses: docker/build-push-action@v5
        with:
          context: ./isc-project/Backend/java-backend/auth
          file: ./isc-project/Backend/java-backend/auth/Dockerfile
          push: true
          tags: |
            josorioam404/isc-java-backend:${{ steps.vars.outputs.TAG }}
            josorioam404/isc-java-backend:latest
            ghcr.io/josorioam404/isc-java-backend:${{ steps.vars.outputs.TAG }}
            ghcr.io/josorioam404/isc-java-backend:latest

      # Python backend
      - name: Build & Push Python backend
        uses: docker/build-push-action@v5
        with:
          context: ./isc-project/Backend/python-backend
          file: ./isc-project/Backend/python-backend/Dockerfile
          push: true
          tags: |
            josorioam404/isc-python-backend:${{ steps.vars.outputs.TAG }}
            josorioam404/isc-python-backend:latest
            ghcr.io/josorioam404/isc-python-backend:${{ steps.vars.outputs.TAG }}
            ghcr.io/josorioam404/isc-python-backend:latest

      # Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./isc-project/Frontend
          file: ./isc-project/Frontend/Dockerfile
          push: true
          no-cache: true
          provenance: false
          sbom: false
          tags: |
            josorioam404/isc-frontend:${{ steps.vars.outputs.TAG }}
            josorioam404/isc-frontend:latest
            ghcr.io/josorioam404/isc-frontend:${{ steps.vars.outputs.TAG }}
            ghcr.io/josorioam404/isc-frontend:latest
