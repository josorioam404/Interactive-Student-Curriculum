server:
  port: 8080

# Frontend URL configuration
frontend:
  url: ${FRONTEND_URL:http://54.89.37.108:5173}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interactive_curriculum}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true  
    open-in-view: false

# Python FastAPI backend URL
python:
  api:
    url: ${PYTHON_API_URL:http://localhost:8000}

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000  # 24 hours in ms

logging:
  level:
    com.curriculum.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

