version: "3.9"

services:
  db:
    image: postgres:15
    container_name: interactive_curriculum_db_dev
    env_file:
      - ./env.dev/database.env
    ports:
      - "5432:5432"
    volumes:
      - ./Database/schema:/docker-entrypoint-initdb.d
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - isc-dev

  java-backend:
    build: ./Backend/java-backend/auth
    container_name: isc_java_backend_dev
    env_file:
      - ./env.dev/java-backend.env
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - isc-dev

  python-backend:
    build: ./Backend/python-backend
    container_name: isc_python_backend_dev
    env_file:
      - ./env.dev/python-backend.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - isc-dev

  frontend:
    build:
      context: ./Frontend
      args:
        BUILD_MODE: development
    container_name: isc_frontend_dev
    ports:
      - "5173:80" # NGINX serves dev build AFTER npm build
    depends_on:
      - java-backend
      - python-backend
    networks:
      - isc-dev

networks:
  isc-dev:
    driver: bridge

volumes:
  postgres_data_dev:
